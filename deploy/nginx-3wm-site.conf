# Bloc nginx pour servir le site statique 3wm-service-site (build Vite),
# compilé par deploy/publier-site.sh dans /var/www/3wm-site.
#
# Installation (une seule fois, sur web-3wm) :
#   sudo cp ~/3wm-service/deploy/nginx-3wm-site.conf /etc/nginx/sites-available/3-wm.net
#   sudo ln -s /etc/nginx/sites-available/3-wm.net /etc/nginx/sites-enabled/3-wm.net
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 3-wm.net -d www.3-wm.net
# (certbot modifie automatiquement ce fichier pour ajouter le HTTPS ensuite —
# ne pas s'inquiéter si le fichier change après cette étape, c'est normal.)

server {
    listen 80;
    listen [::]:80;
    server_name 3-wm.net www.3-wm.net;

    root /var/www/3wm-site;
    index index.html;

    # Ne jamais mettre en cache index.html : sinon un visiteur peut garder
    # une ancienne version de la page, qui référence des fichiers JS
    # supprimés lors d'une mise à jour suivante → écran blanc (c'est très
    # probablement ce qui causait le plantage sur téléphone).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Les fichiers dans /assets/ ont un nom unique (hash) à chaque
    # compilation : on peut les mettre en cache très longtemps sans risque.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Site "single page application" (React Router) : toute route inconnue
    # renvoie index.html, React Router gère l'affichage côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
